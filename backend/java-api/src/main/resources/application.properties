spring.application.name=java-api
server.address=127.0.0.1
agent.service.base-url=${AGENT_SERVICE_BASE_URL:http://127.0.0.1:8000}
agent.service.connect-timeout-ms=${AGENT_CONNECT_TIMEOUT_MS:3000}
agent.service.read-timeout-ms=${AGENT_READ_TIMEOUT_MS:10000}
agent.service.research-read-timeout-ms=${AGENT_RESEARCH_READ_TIMEOUT_MS:120000}

# Local single-instance database. Relative path is resolved from the launch directory.
spring.datasource.url=jdbc:h2:file:${INFOEXPLORER_DATA_DIR:./data}/infoexplorer;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.flyway.enabled=true
research.worker.enabled=true
research.worker.poll-delay-ms=500
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=185s
